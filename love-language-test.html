<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>사랑의 언어 유형 테스트</title>
  <style>
    :root {
      --bg: #faf7f2;
      --paper: #ffffff;
      --ink: #2f2a26;
      --muted: #746b62;
      --line: #e8ded2;
      --accent: #b97955;
      --accent-dark: #8f5638;
      --soft: #f4ebe2;
      --danger: #cf5b45;
      --shadow: 0 14px 35px rgba(76, 56, 40, 0.10);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top left, #fff3e7 0, transparent 34%), var(--bg);
      line-height: 1.65;
    }

    .wrap {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 72px;
    }

    header {
      background: linear-gradient(135deg, #fff 0%, #fff9f4 100%);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 26px;
      padding: 34px 26px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 48px);
      letter-spacing: -0.06em;
      line-height: 1.18;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
    }

    .notice {
      margin-top: 22px;
      padding: 15px 17px;
      background: var(--soft);
      border-radius: 16px;
      color: #57483d;
      font-weight: 600;
    }

    .progress-box {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 10px 0 14px;
      background: linear-gradient(to bottom, rgba(250,247,242,0.98), rgba(250,247,242,0.82));
      backdrop-filter: blur(8px);
    }

    .progress-inner {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 8px 22px rgba(76, 56, 40, 0.06);
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .progress-track {
      height: 10px;
      background: #f1e8df;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #d9a27d);
      border-radius: 999px;
      transition: width .25s ease;
    }

    form {
      display: grid;
      gap: 16px;
    }

    .question {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 8px 22px rgba(76, 56, 40, 0.05);
    }

    .question.missing {
      border-color: var(--danger);
      box-shadow: 0 0 0 4px rgba(207, 91, 69, .12);
    }

    .q-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 14px;
      font-weight: 800;
    }

    .q-num {
      color: var(--accent-dark);
      font-size: 18px;
    }

    .q-help {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      position: relative;
      display: block;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 15px 15px 15px 48px;
      background: #fff;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
      font-weight: 600;
    }

    .choice:hover { transform: translateY(-1px); border-color: #d8c4b2; }

    .choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .choice::before {
      content: "";
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border: 2px solid #d3c5b7;
      border-radius: 50%;
      background: #fff;
    }

    .choice:has(input:checked) {
      background: #fff6ee;
      border-color: var(--accent);
    }

    .choice:has(input:checked)::before {
      border-color: var(--accent-dark);
      box-shadow: inset 0 0 0 5px #fff, inset 0 0 0 12px var(--accent-dark);
    }

    .actions {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    button:hover { transform: translateY(-1px); }

    .primary { background: var(--accent-dark); color: #fff; }
    .secondary { background: var(--soft); color: #4f4035; }
    .danger { background: #f7e5df; color: #a94532; }

    .alert {
      display: none;
      margin: 0 0 14px;
      padding: 14px 16px;
      border-radius: 14px;
      color: #8b3828;
      background: #fff0eb;
      border: 1px solid #f0c7bc;
      font-weight: 800;
    }

    .result {
      display: none;
      margin-top: 22px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 26px;
      box-shadow: var(--shadow);
    }

    .result h2 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 38px);
      letter-spacing: -0.05em;
    }

    .result-sub { margin: 0 0 22px; color: var(--muted); }

    .top-card {
      padding: 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #fff6ee, #fffdfb);
      border: 1px solid #ead8c6;
      margin-bottom: 20px;
    }

    .top-card strong { font-size: 24px; color: var(--accent-dark); }

    .bars { display: grid; gap: 13px; margin: 20px 0 28px; }
    .bar-row { display: grid; gap: 7px; }
    .bar-head { display: flex; justify-content: space-between; gap: 10px; font-weight: 800; }
    .bar-track { height: 15px; background: #f0e7df; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-dark), #d9a27d); border-radius: 999px; }

    .rank-list { display: grid; gap: 14px; }
    .rank-item {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      background: #fffdfb;
    }
    .rank-item h3 { margin: 0 0 8px; font-size: 19px; }
    .rank-item p { margin: 0; color: #594d43; }

    .small-note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .wrap { width: min(100% - 22px, 980px); padding-top: 22px; }
      header, .result { padding: 22px 18px; border-radius: 22px; }
      .question { padding: 17px; }
      .choice { padding: 14px 13px 14px 44px; }
      .actions button { width: 100%; }
    }

    @media print {
      body { background: #fff; }
      .progress-box, form, .actions, .alert { display: none !important; }
      .wrap { width: 100%; padding: 0; }
      header, .result { box-shadow: none; border: 0; }
      .result { display: block !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>사랑의 언어 유형 테스트</h1>
      <p class="lead">각 문항에서 나에게 더 가까운 문장을 선택하세요.</p>
      <div class="notice">모든 문항을 선택한 뒤 마지막에 있는 <b>결과 보기</b>를 누르면 1~5순위 결과가 표시됩니다.</div>
    </header>

    <section class="progress-box" aria-label="진행률">
      <div class="progress-inner">
        <div class="progress-label">
          <span>답변 진행률</span>
          <span id="progressText">0 / 30</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </section>

    <p class="alert" id="alertBox" role="alert"></p>

    <form id="testForm"></form>

    <section class="actions" aria-label="결과 버튼">
      <button type="button" class="primary" id="showResultBtn">결과 보기</button>
      <button type="button" class="secondary" id="printBtn">인쇄 / PDF 저장</button>
      <button type="button" class="danger" id="resetBtn">답변 초기화</button>
    </section>

    <section class="result" id="resultBox" aria-live="polite">
      <h2>테스트 결과</h2>
      <div class="top-card" id="topCard"></div>
      <div class="bars" id="bars"></div>
      <div class="rank-list" id="rankList"></div>
      <p class="small-note">이 테스트는 자기이해와 대화를 돕기 위한 참고용입니다. 관계 안에서 서로의 표현 방식을 나누는 데 사용해 주세요.</p>
    </section>
  </main>

  <script>
    const TYPES = {
      words: {
        name: '인정하는 말',
        desc: '칭찬, 격려, 고마움, 따뜻한 표현을 통해 사랑을 깊이 느끼는 편입니다. 마음을 담은 한마디가 오래 남고, 관계의 안정감을 만들어 줍니다.'
      },
      time: {
        name: '함께하는 시간',
        desc: '상대가 나에게 집중해주고 시간을 내어 함께할 때 사랑받는다고 느끼는 편입니다. 같은 공간에 있는 것보다, 마음을 함께 두는 시간이 중요합니다.'
      },
      gifts: {
        name: '선물',
        desc: '크기나 가격보다 “나를 생각했다”는 마음이 담긴 선물에서 사랑을 느끼는 편입니다. 작은 물건도 기억과 의미가 담기면 크게 다가옵니다.'
      },
      service: {
        name: '봉사',
        desc: '말보다 실제적인 도움과 배려에서 사랑을 느끼는 편입니다. 힘들 때 도와주거나 필요한 일을 함께 감당해주는 행동이 마음에 크게 남습니다.'
      },
      touch: {
        name: '스킨십',
        desc: '손잡기, 포옹, 어깨를 토닥이는 행동처럼 따뜻한 신체적 표현을 통해 사랑을 느끼는 편입니다. 가까움과 안정감을 몸으로 확인하는 방식입니다.'
      }
    };

    const QUESTIONS = [
      ['힘들 때 “정말 수고했어”라는 말을 들으면 마음이 풀린다.', '바쁜 중에도 나와 시간을 보내주면 사랑받는다고 느낀다.', 'words', 'time'],
      ['나를 떠올리며 준비한 작은 선물이 오래 기억난다.', '내가 해야 할 일을 대신 도와주면 고맙고 든든하다.', 'gifts', 'service'],
      ['가볍게 손을 잡아주거나 안아주면 마음이 안정된다.', '내 장점을 말로 표현해주면 자신감이 생긴다.', 'touch', 'words'],
      ['휴대폰을 내려놓고 내 이야기를 들어주면 좋다.', '필요한 것을 기억했다가 챙겨주면 마음이 따뜻해진다.', 'time', 'gifts'],
      ['피곤한 날 집안일이나 일을 도와주면 사랑을 느낀다.', '가까이 앉거나 자연스럽게 기대게 해주면 편안하다.', 'service', 'touch'],
      ['“네가 있어서 좋아”라는 말을 들으면 오래 힘이 난다.', '둘만의 시간을 따로 내주면 소중하게 느껴진다.', 'words', 'time'],
      ['작은 기념일을 기억하고 무언가 건네주면 기쁘다.', '말하지 않아도 필요한 일을 해주면 감동을 받는다.', 'gifts', 'service'],
      ['따뜻하게 안아주면 말보다 더 크게 위로가 된다.', '고맙다는 말을 구체적으로 들으면 마음이 채워진다.', 'touch', 'words'],
      ['함께 산책하거나 차를 마시며 이야기하는 시간이 좋다.', '내 취향을 기억한 선물을 받으면 사랑을 느낀다.', 'time', 'gifts'],
      ['내가 지쳐 있을 때 실질적으로 도와주면 고맙다.', '손을 잡고 걸을 때 관계가 더 가깝게 느껴진다.', 'service', 'touch'],
      ['잘한 점을 알아봐주고 말해주면 마음이 밝아진다.', '일부러 시간을 비워 나와 함께해주면 좋다.', 'words', 'time'],
      ['비싸지 않아도 마음이 담긴 선물이 좋다.', '내 부담을 덜어주는 행동을 해주면 사랑받는 것 같다.', 'gifts', 'service'],
      ['어깨를 감싸주거나 토닥여주면 위로가 된다.', '나를 응원하는 말을 들으면 다시 힘이 난다.', 'touch', 'words'],
      ['함께 있는 동안 나에게 집중해주면 좋다.', '나에게 어울릴 것 같아 골랐다는 선물이 좋다.', 'time', 'gifts'],
      ['말보다 행동으로 도와주는 모습이 크게 와닿는다.', '자연스럽게 가까이 있어주면 사랑을 느낀다.', 'service', 'touch'],
      ['나를 인정해주는 말을 들으면 관계가 안전하게 느껴진다.', '평범한 하루라도 같이 보내면 마음이 채워진다.', 'words', 'time'],
      ['갑자기 건네는 작은 선물에 마음이 열린다.', '내가 어려워하는 일을 함께 해결해주면 고맙다.', 'gifts', 'service'],
      ['포옹 한 번이 긴 설명보다 더 큰 위로가 된다.', '사랑한다는 말을 자주 들으면 안심이 된다.', 'touch', 'words'],
      ['둘이 마주 앉아 대화하는 시간이 가장 좋다.', '나를 생각해서 준비한 물건이 오래 기억난다.', 'time', 'gifts'],
      ['상대가 먼저 나서서 도와주면 사랑을 느낀다.', '손길이나 포옹으로 마음을 표현해주면 좋다.', 'service', 'touch'],
      ['말로 마음을 표현해주면 사랑이 분명하게 느껴진다.', '하던 일을 멈추고 내 이야기를 들어주면 좋다.', 'words', 'time'],
      ['내가 좋아하는 것을 기억해 선물해주면 감동을 받는다.', '힘든 일을 대신 맡아주면 마음이 놓인다.', 'gifts', 'service'],
      ['가까운 스킨십이 있을 때 관계가 더 따뜻하게 느껴진다.', '격려의 말을 들으면 하루가 달라진다.', 'touch', 'words'],
      ['함께한 시간이 추억으로 오래 남는다.', '작은 편지나 물건처럼 남는 표현이 좋다.', 'time', 'gifts'],
      ['필요할 때 실제로 움직여주는 사람이 고맙다.', '가볍게 기대거나 손을 잡는 순간이 좋다.', 'service', 'touch'],
      ['내 마음을 알아주는 말을 들으면 깊이 사랑받는 것 같다.', '바쁜 와중에도 나를 위해 시간을 내주면 좋다.', 'words', 'time'],
      ['사소해도 나를 위해 준비한 선물이 좋다.', '상대가 내 일을 함께 감당해주면 든든하다.', 'gifts', 'service'],
      ['안아주거나 손을 잡아주면 관계가 가까워진다.', '내 노력을 인정해주는 말이 가장 큰 힘이 된다.', 'touch', 'words'],
      ['같이 밥 먹고 이야기하는 시간이 가장 편안하다.', '내가 말했던 것을 기억해 선물해주면 감동이다.', 'time', 'gifts'],
      ['내가 부탁하기 전에 도와주면 사랑을 느낀다.', '따뜻한 접촉이 있을 때 마음이 안정된다.', 'service', 'touch']
    ];

    const form = document.getElementById('testForm');
    const alertBox = document.getElementById('alertBox');
    const resultBox = document.getElementById('resultBox');
    const progressText = document.getElementById('progressText');
    const progressFill = document.getElementById('progressFill');

    function renderQuestions() {
      form.innerHTML = QUESTIONS.map((q, index) => `
        <fieldset class="question" id="q${index + 1}">
          <legend class="q-title"><span class="q-num">${index + 1}번</span><span class="q-help">더 가까운 문장을 선택하세요.</span></legend>
          <div class="choices">
            <label class="choice">
              <input type="radio" name="q${index}" value="${q[2]}">
              ${q[0]}
            </label>
            <label class="choice">
              <input type="radio" name="q${index}" value="${q[3]}">
              ${q[1]}
            </label>
          </div>
        </fieldset>
      `).join('');
    }

    function getAnsweredCount() {
      let count = 0;
      for (let i = 0; i < QUESTIONS.length; i++) {
        if (form.querySelector(`input[name="q${i}"]:checked`)) count++;
      }
      return count;
    }

    function updateProgress() {
      const answered = getAnsweredCount();
      progressText.textContent = `${answered} / ${QUESTIONS.length}`;
      progressFill.style.width = `${answered / QUESTIONS.length * 100}%`;
      document.querySelectorAll('.question').forEach(q => q.classList.remove('missing'));
      saveAnswers();
    }

    function saveAnswers() {
      const answers = {};
      for (let i = 0; i < QUESTIONS.length; i++) {
        const checked = form.querySelector(`input[name="q${i}"]:checked`);
        if (checked) answers[`q${i}`] = checked.value;
      }
      localStorage.setItem('loveLanguageAnswers', JSON.stringify(answers));
    }

    function loadAnswers() {
      const saved = JSON.parse(localStorage.getItem('loveLanguageAnswers') || '{}');
      Object.entries(saved).forEach(([name, value]) => {
        const input = form.querySelector(`input[name="${name}"][value="${value}"]`);
        if (input) input.checked = true;
      });
      updateProgress();
    }

    function findMissingQuestion() {
      for (let i = 0; i < QUESTIONS.length; i++) {
        if (!form.querySelector(`input[name="q${i}"]:checked`)) return i + 1;
      }
      return null;
    }

    function calculateScores() {
      const scores = Object.fromEntries(Object.keys(TYPES).map(type => [type, 0]));
      for (let i = 0; i < QUESTIONS.length; i++) {
        const checked = form.querySelector(`input[name="q${i}"]:checked`);
        if (checked) scores[checked.value]++;
      }
      return Object.entries(scores)
        .map(([key, score]) => ({ key, score, ...TYPES[key] }))
        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, 'ko'));
    }


    function addRankLabels(ranked) {
      let previousScore = null;
      let previousRank = 0;
      return ranked.map((item, index) => {
        const rank = item.score === previousScore ? previousRank : index + 1;
        previousScore = item.score;
        previousRank = rank;
        const tiedCount = ranked.filter(r => r.score === item.score).length;
        const rankLabel = tiedCount > 1 ? `공동 ${rank}순위` : `${rank}순위`;
        return { ...item, rank, rankLabel };
      });
    }
    function hasFinalConsonant(word) {
      if (!word) return false;
      const last = word[word.length - 1];
      const code = last.charCodeAt(0);
      if (code < 0xAC00 || code > 0xD7A3) return false;
      return (code - 0xAC00) % 28 !== 0;
    }

    function joinKoreanNames(names) {
      if (names.length <= 1) return names[0] || '';
      if (names.length === 2) {
        const particle = hasFinalConsonant(names[0]) ? '과' : '와';
        return `${names[0]}${particle} ${names[1]}`;
      }
      const last = names[names.length - 2];
      const particle = hasFinalConsonant(last) ? '과' : '와';
      return `${names.slice(0, -2).join(', ')}, ${last}${particle} ${names[names.length - 1]}`;
    }

    function showResult() {
      const missing = findMissingQuestion();
      if (missing) {
        alertBox.style.display = 'block';
        alertBox.textContent = `${missing}번 문항을 선택해 주세요.`;
        const target = document.getElementById(`q${missing}`);
        target.classList.add('missing');
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      alertBox.style.display = 'none';
      const ranked = addRankLabels(calculateScores());
      const maxScore = Math.max(...ranked.map(r => r.score), 1);
      const topScore = ranked[0].score;
      const topItems = ranked.filter(r => r.score === topScore);
      const topNames = joinKoreanNames(topItems.map(r => r.name));

      document.getElementById('topCard').innerHTML = `
        <div>${topItems.length > 1 ? '당신의 공동 1순위 사랑의 언어' : '당신의 1순위 사랑의 언어'}</div>
        <strong>${topNames}</strong>
      `;

      document.getElementById('bars').innerHTML = ranked.map((r, idx) => `
        <div class="bar-row">
          <div class="bar-head"><span>${r.rankLabel}. ${r.name}</span><span>${r.score}점</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${r.score / maxScore * 100}%"></div></div>
        </div>
      `).join('');

      document.getElementById('rankList').innerHTML = ranked.map((r, idx) => `
        <article class="rank-item">
          <h3>${r.rankLabel}. ${r.name} · ${r.score}점</h3>
          <p>${r.desc}</p>
        </article>
      `).join('');

      resultBox.style.display = 'block';
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function resetTest() {
      if (!confirm('답변을 모두 초기화할까요?')) return;
      form.reset();
      localStorage.removeItem('loveLanguageAnswers');
      resultBox.style.display = 'none';
      alertBox.style.display = 'none';
      updateProgress();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderQuestions();
    loadAnswers();
    form.addEventListener('change', updateProgress);
    document.getElementById('showResultBtn').addEventListener('click', showResult);
    document.getElementById('printBtn').addEventListener('click', () => window.print());
    document.getElementById('resetBtn').addEventListener('click', resetTest);
  </script>
</body>
</html>
